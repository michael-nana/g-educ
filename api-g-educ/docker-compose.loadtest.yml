services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app_password
      POSTGRES_DB: geduc_loadtest
    volumes:
      - loadtest-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d geduc_loadtest"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://app:app_password@db:5432/geduc_loadtest?schema=public
      JWT_ACCESS_SECRET: local-load-test-access-secret-only
      JWT_REFRESH_SECRET: local-load-test-refresh-secret-only
      OTP_VERIFICATION_SECRET: local-load-test-otp-secret-only
      S3_ENDPOINT: http://s3-not-used.invalid
      S3_REGION: us-east-1
      S3_BUCKET: geduc
      S3_ACCESS_KEY_ID: geduc-local
      S3_SECRET_ACCESS_KEY: geduc-local-secret
      ADMIN_PHONE: ${ADMIN_PHONE:-+22670000000}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin-Local-2026!}
      LOAD_TEST_PHONE: ${LOAD_TEST_PHONE:-+22670000001}
      LOAD_TEST_PASSWORD: ${LOAD_TEST_PASSWORD:-LoadTest-Local-2026!}
      LOAD_TEST_DISPLAY_NAME: ${LOAD_TEST_DISPLAY_NAME:-Eleve Charge Local}
      LOAD_TEST_CHAPTERS: ${LOAD_TEST_CHAPTERS:-8}
      LOAD_TEST_LESSONS_PER_CHAPTER: ${LOAD_TEST_LESSONS_PER_CHAPTER:-20}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-10000}
    ports:
      - "127.0.0.1:3100:3000"
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-c", "npx prisma migrate deploy && node dist/src/main.js"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/v1/classes').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 45s

  loadtest:
    image: node:24-alpine
    profiles: ["loadtest"]
    working_dir: /load-test
    volumes:
      - ./load-test:/load-test:ro
    environment:
      LOAD_TEST_TARGET: local
      LOAD_TEST_BASE_URL: http://api:3000/api/v1
      LOAD_TEST_TOKEN: ${LOAD_TEST_TOKEN:-}
      LOAD_TEST_PHONE: ${LOAD_TEST_PHONE:-+22670000001}
      LOAD_TEST_PASSWORD: ${LOAD_TEST_PASSWORD:-LoadTest-Local-2026!}
      LOAD_TEST_VUS: ${LOAD_TEST_VUS:-10}
      LOAD_TEST_RAMP_SECONDS: ${LOAD_TEST_RAMP_SECONDS:-30}
      LOAD_TEST_DURATION_SECONDS: ${LOAD_TEST_DURATION_SECONDS:-60}
      LOAD_TEST_THINK_SECONDS: ${LOAD_TEST_THINK_SECONDS:-3}
    depends_on:
      api:
        condition: service_healthy
    command: ["node", "mobile-read.mjs"]

volumes:
  loadtest-db-data:
